name: Update market quotes
on:
  schedule:
    # UTC 08:00-23:59 covers 04:00-20:00 ET across DST; Python filters session and cadence.
    - cron: '*/5 8-23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quote-update
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas pandas_market_calendars
      - name: Fetch Alpaca IEX snapshots
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python scripts/update_quotes.py
      - name: Commit quote snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git diff --cached --quiet || (git commit -m "Refresh Alpaca IEX quotes" && git push)
