name: Update market quotes
on:
  schedule:
    # UTC range covers 9:30am–4pm ET in both EST and EDT; script checks NYSE calendar.
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quote-update
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas pandas_market_calendars
      - run: python scripts/update_quotes.py
      - name: Commit quote snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git diff --cached --quiet || (git commit -m "Refresh market quotes" && git push)
